spring:
  application:
    name: ai-extraction-service
  datasource:
    url: jdbc:postgresql://localhost:5432/lending_extraction
    username: ${DB_USERNAME:lending_user}
    password: ${DB_PASSWORD:lending_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/auth/realms/lending}

server:
  port: 8083
  servlet:
    context-path: /

anthropic:
  base-url: https://api.anthropic.com
  api-key: ${ANTHROPIC_API_KEY:your-key-here}
  model: claude-3-haiku-20240307
  max-tokens: 1024
  timeout-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true

logging:
  level:
    com.lending.ai_extraction_service: INFO
    org.springframework.security: WARN